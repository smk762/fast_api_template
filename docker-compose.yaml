version: '3.7'

x-zcash-params-volume:
  &zcash-params
  type: bind
  source: /home/smk762/.zcash-params
  target: /home/komodian/.zcash-params

services:

  vote2023:
    env_file:
      - .env
    build:
      context: ./docker_files
      dockerfile: Dockerfile.KMD
      args:
        - USER_ID=$USER_ID
        - GROUP_ID=$GROUP_ID
        - COMMIT_HASH=156dba6
        - SERVICE_CLI="komodo-cli -ac_name=CCL"
        - LAUNCH_FILE=run_CCL.sh
    ports:
      - "127.0.0.1:20848:20848"
      - "127.0.0.1:20849:20849"
      - "127.0.0.1:20850:20850"
    volumes:
      - <<: *zcash-params
      - /home/smk762/.komodo/VOTE2023:/home/komodian/.komodo/VOTE2023
    container_name: vote2023
    restart: always
    stop_grace_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    command: ["/run.sh"]
